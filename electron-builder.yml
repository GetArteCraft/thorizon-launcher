appId: app.thorizon.launcher
productName: THorizon
copyright: THorizon
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: resources
    to: resources
compression: maximum
win:
  target:
    - nsis
  icon: icon.ico
  artifactName: THorizon-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: THorizon
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
    - deb
  icon: icons
  category: Game
  maintainer: THorizon
  artifactName: THorizon-${version}-${arch}.${ext}
mac:
  target:
    - dmg
  category: public.app-category.games
  icon: icon.png
publish:
  provider: github
  owner: GetArteCraft
  repo: thorizon-launcher
